name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os
      SESSION_SECRET: github-actions-ci-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bun run lint
      - run: bun run build

  restore-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bearing_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESTORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bearing_restore_test
      V1_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bearing_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:v1

  v1-release-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bearing_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bearing_browser_test
      V1_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bearing_browser_test
      SESSION_SECRET: github-actions-browser-secret-at-least-32-characters
      BEARING_V1_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-browser-evidence
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
